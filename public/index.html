<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearGuide</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="intro">
        <p class="eyebrow">Your first AI agent</p>
        <h1>ClearGuide</h1>
        <p class="subtitle">Ask a question. Get a simple explanation.</p>
      </section>

      <section class="chat-panel" aria-label="ClearGuide chat">
        <div id="messages" class="messages" aria-live="polite">
          <div class="message agent-message">
            <strong>ClearGuide</strong>
            <p>Hi. What would you like me to explain?</p>
          </div>
        </div>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="message">Your question</label>
          <textarea id="message" rows="2" placeholder="For example: What is a black hole?" required></textarea>
          <button type="submit">Ask ClearGuide</button>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
